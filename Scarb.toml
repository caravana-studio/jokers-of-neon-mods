[package]
cairo-version = "=2.10.1"
name = "jokers_of_neon_mods"
version = "0.19.0"
edition = "2023_01"

[cairo]
sierra-replace-ids = true

[tool.fmt]
sort-module-level-items = true
max-line-length = 120

[dependencies]
dojo = { git = "https://github.com/dojoengine/dojo", tag = "v1.6.0-alpha.1" }
jokers_of_neon_lib = { git = "https://github.com/caravana-studio/jokers-of-neon-lib", branch="ref-mainnet" }

[[target.starknet-contract]]
build-external-contracts = ["dojo::world::world_contract::world"]

[dev-dependencies]
dojo_cairo_test = { git = "https://github.com/dojoengine/dojo", tag = "v1.6.0-alpha.1" }

[profile.slot]
[profile.testnet]
[profile.mainnet]

[lib]
